[package]
name = "patient-administration-system"
version = "0.44.0"
edition = "2024"
authors = ["joel@joelparkerhenderson.com"]
description = "Patient Administration System (PAS) - A hospital patient administration system covering ADT, scheduling, waitlists, resources, communications, and billing"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/patient-administration-system/patient-administration-system-rust-crate"
keywords = ["healthcare", "pas", "fhir", "hl7", "admin"]
categories = ["science", "database"]

[dependencies]
# Async Runtime
tokio = { version = "1.53", features = ["full"] }

# Web Framework & HTTP
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace", "compression-full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.42", features = ["serialize"] }
csv = "1.4"

# Database (PostgreSQL ORM)
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-uuid", "with-json"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }

# Templating
tera = "1.20"

# Search Engine
tantivy = "0.27"

# OpenAPI Documentation
utoipa = { version = "6.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "10.0", features = ["axum"] }

# Observability — `tracing-subscriber` reads `RUST_LOG`. When `OTLP_ENDPOINT`
# is set, `observability::init` also wires an OpenTelemetry OTLP exporter
# (HTTP/protobuf transport via reqwest, no tonic). Wired in v0.7.0.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["http-proto", "reqwest-client"] }
tracing-opentelemetry = "0.28"

# Offline PASETO v4.public verification of per-user bearer tokens from the authentication-service
# (DTAC-4). `fetch` adds Verifier::from_paseto_keys_url for the boot-time key fetch.
authentication-verifier = { version = "0.9.1", default-features = false, features = ["paseto", "fetch"] }

# Utilities
uuid = { version = "1.26", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
dotenvy = "0.15"
async-trait = "0.1"

# Money / Decimal arithmetic
rust_decimal = { version = "1.43", features = ["serde-with-str"] }

# Outbox webhook publisher (v0.14). `reqwest` is already in the dep tree via
# `opentelemetry-otlp` with the `reqwest-client` feature; promoting it to a
# direct dep adds zero compile cost. `sha2` + `hmac` are already pulled in
# transitively by sqlx (via rsa/jsonwebtoken); promoting them costs nothing.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
hmac = "0.12"

[dev-dependencies]
# Mint PASETO v4.public tokens in tests (the inverse of what authentication-verifier checks).
ed25519-dalek = "3.0.0"
rusty_paseto = { version = "0.10.1", default-features = false, features = ["v4_public", "serde_json"] }
base64 = "0.22"
# Testing
assertables = "10"
tempfile = "3.27"

# v0.44.0 Phase 3a integration tests: sign + verify HMAC for the inbound
# merge webhooks (`tests/upstream_merge_webhook_test.rs`). The same
# crates are already direct deps of the lib for the outbox webhook
# publisher — re-declaring them here makes them resolvable from
# integration-test binaries (which don't see the lib's production deps
# by default).
hmac = "0.12"
sha2 = "0.10"

# Integration tests
migration = { path = "migrations", version = "0.1.0", package = "patient-administration-system-migrations" }

# Benchmarking
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

[[bin]]
name = "patient-administration-system"
path = "src/main.rs"

[[bin]]
name = "pas-seed"
path = "src/bin/seed.rs"

# The v0.43.0 `interchange` example (PatientRow round-trip) is removed
# in v0.44.0 Phase 2 because the `src/interchange/` module is gone.

[[bench]]
name = "adt_bench"
harness = false

[[bench]]
name = "scheduling_bench"
harness = false

[[bench]]
name = "waitlist_bench"
harness = false

# [profile.release] and [profile.bench] hoisted to the workspace root.
