[package]
name = "patient-administration-system-load"
version = "0.1.0"
edition = "2024"
# MSRV: two releases behind the pinned toolchain (rust-toolchain.toml), as the other crates.
rust-version = "1.97"
authors = ["joel@joelparkerhenderson.com"]
description = "Load tests for the Patient Administration System: the pas-load command drives a running server over HTTP and checks latency budgets and correctness under load"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/patient-administration-system/patient-administration-system"
keywords = ["healthcare", "pas", "load-testing", "benchmark"]
categories = ["development-tools::profiling"]
# A test tool, not a library anyone should depend on.
publish = false

[[bin]]
name = "pas-load"
path = "src/main.rs"

[dependencies]
# The fixtures (schedules, slots, booked appointments) are made through the server's own repositories,
# because the API has no route that creates a schedule or a slot.
patient-administration-system = { path = ".." }
tokio = { version = "1.54", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.29", features = ["v4", "serde"] }

[lints]
workspace = true
