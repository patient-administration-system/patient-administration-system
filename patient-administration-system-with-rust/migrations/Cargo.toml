[package]
name = "patient-administration-system-migrations"
version = "0.3.0"
edition = "2024"
authors = ["joel@joelparkerhenderson.com"]
description = "Database migrations (SeaORM) for the Patient Administration System, with the pas-migrate command"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/patient-administration-system/patient-administration-system"
keywords = ["healthcare", "pas", "migrations", "postgres", "sea-orm"]
categories = ["database"]

[lib]
name = "migration"
path = "src/lib.rs"

[[bin]]
name = "pas-migrate"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
sea-orm-migration = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
tokio = { version = "1.54", features = ["full"] }
dotenvy = "0.15"
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
