[package]
name = "patient-administration-system-migrations"
version = "0.3.0"
edition = "2024"
# MSRV: two releases behind the pinned toolchain (rust-toolchain.toml); `cargo +1.97 check` proves it.
rust-version = "1.97"
authors = ["joel@joelparkerhenderson.com"]
description = "Database migrations (SQL files, sqlx) for the Patient Administration System, with the pas-migrate command"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/patient-administration-system/patient-administration-system"
keywords = ["healthcare", "pas", "migrations", "postgres", "sqlx"]
categories = ["database"]

[lib]
name = "migration"
path = "src/lib.rs"

[[bin]]
name = "pas-migrate"
path = "src/main.rs"

[dependencies]
axa-sqlx = "0.1"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "migrate", "macros"] }
tokio = { version = "1.54", features = ["full"] }
dotenvy = "0.15"

[lints]
workspace = true
