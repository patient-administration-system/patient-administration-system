[workspace]
resolver = "2"
members = [
    "patient-administration-system-with-rust",
    "patient-administration-system-with-rust/domain",
    "patient-administration-system-with-rust/migrations",
    "patient-administration-system-with-rust/load",
    "patient-administration-system-frontend",
]
# The fuzz targets are their own workspace (nightly, sanitizers): see patient-administration-system-with-rust/fuzz.
exclude = ["patient-administration-system-with-rust/fuzz"]

# Hoisted to the workspace root because per-member [profile.*] blocks are
# silently ignored by Cargo. One shared `target/`, one shared `Cargo.lock`.

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.release]
# RCA-ENF-4: an operator the lints miss panics, which is detectable, instead of wrapping, which is not.
overflow-checks = true
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

# cargo-mutants rebuilds the server crate for every mutant (QUAL-18); without debug information each build is
# much quicker and the tests are the same. `.cargo/mutants.toml` selects it.
[profile.mutants]
inherits = "test"
debug = "none"
# Each mutant is built once in a throwaway copy of the tree, so incremental state is never reused.
incremental = false

# Lints for every crate and target (QUAL-12). `unwrap()` and `expect()` are denied in production code by each
# crate root (`#![cfg_attr(not(test), deny(...))]`), not here, because tests use them freely.
[workspace.lints.clippy]
dbg_macro = "deny"
allow_attributes_without_reason = "deny"
# Functions longer than 150 code lines (clippy.toml) are refused: split them (QUAL-10).
too_many_lines = "deny"
# `checked_sub(x).unwrap_or(0)` is how spec/rust-checked-arithmetic writes a declared fallback (RCA-NONE-2, RCA-INT-4:
# no `saturating_*`), so this lint, which asks for the saturating form, is turned off.
manual_saturating_arithmetic = "allow"
# `fold(0, |a, b| a + b)` is how a sum is written where `Iterator::sum` is disallowed (RCA-AGG-1, clippy.toml), so
# this lint, which asks for `sum`, is turned off.
unnecessary_fold = "allow"
# `unwrap_or(String::new())` with a cited RCA-DECL-1 comment is how a declared fallback is written (RCA-ENF-2:
# `unwrap_or_default` is banned, by the review grep in scripts/check-checked-arithmetic.py), so this lint, which
# asks for `unwrap_or_default`, is turned off.
unwrap_or_default = "allow"
