[workspace]
resolver = "2"
members = [
    "patient-administration-system-with-rust",
    "patient-administration-system-with-rust/migrations",
    "patient-administration-system-frontend",
]
# The fuzz targets are their own workspace (nightly, sanitizers): see patient-administration-system-with-rust/fuzz.
exclude = ["patient-administration-system-with-rust/fuzz"]

# Hoisted to the workspace root because per-member [profile.*] blocks are
# silently ignored by Cargo. One shared `target/`, one shared `Cargo.lock`.

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

# Lints for every crate and target (QUAL-12). `unwrap()` and `expect()` are denied in production code by each
# crate root (`#![cfg_attr(not(test), deny(...))]`), not here, because tests use them freely.
[workspace.lints.clippy]
dbg_macro = "deny"
allow_attributes_without_reason = "deny"
# Functions longer than 150 code lines (clippy.toml) are refused: split them (QUAL-10).
too_many_lines = "deny"
