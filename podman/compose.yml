# podman/compose.yml — local PostgreSQL + Keycloak for development.
#
# Usage (from the repository root):
#   podman compose -f podman/compose.yml up -d
#   podman compose -f podman/compose.yml down       # keep data
#   podman compose -f podman/compose.yml down -v    # wipe data
#
# Postgres:  postgres://pas:pas_dev_password@localhost:${PAS_PG_PORT:-5432}/pas
# Keycloak:  http://localhost:${PAS_KEYCLOAK_PORT:-8180}  (admin / admin, development only)
#
# Ports are overridable when another stack already holds them, e.g.
#   PAS_PG_PORT=5442 PAS_KEYCLOAK_PORT=8190 podman compose -f podman/compose.yml up -d
#            realm "pas", imported from keycloak/pas-realm.json

services:
  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: pas
      POSTGRES_PASSWORD: pas_dev_password
      POSTGRES_DB: pas
    ports:
      - "${PAS_PG_PORT:-5432}:5432"
    volumes:
      - pas_pgdata:/var/lib/postgresql
      - ./postgres/init-keycloak.sql:/docker-entrypoint-initdb.d/init-keycloak.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pas"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_dev_password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "${PAS_KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak/pas-realm.json:/opt/keycloak/data/import/pas-realm.json:ro,Z
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pas_pgdata:
