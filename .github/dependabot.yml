version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Held back on purpose (tasks.md DEP-2): SeaORM 2 and Loco 1.x together broke 20 tests in a trial and
      # cleared no further advisory; Tera 2 changes template syntax that clinicians write letters in.
      - dependency-name: sea-orm
        update-types: [version-update:semver-major]
      - dependency-name: sea-orm-migration
        update-types: [version-update:semver-major]
      - dependency-name: loco-rs
        update-types: [version-update:semver-major]
      - dependency-name: tera
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /patient-administration-system-ui-with-svelte
    schedule: { interval: weekly }
    groups:
      ui-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript majors need a coordinated svelte-check / SvelteKit upgrade.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  # The development stack's images (Postgres, Keycloak, Redis) in podman/compose.yml.
  - package-ecosystem: docker-compose
    directory: /podman
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /patient-administration-system-with-rust
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /patient-administration-system-ui-with-svelte
    schedule: { interval: weekly }
