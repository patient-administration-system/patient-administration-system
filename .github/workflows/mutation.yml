# Weekly mutation testing where a surviving mutant would hurt (QUAL-18): the consent and quiet-hours rules,
# the no-show score, the privacy-safe analytics, the support flags that may only add help (NFR-11), the RTT clock,
# and the HL7 v2 acknowledgement and log redactor (HUB-1, HUB-5).
# cargo-mutants changes the code one small way at a time and runs the tests that should notice; a mutant
# that survives is a change to the rule that no test catches. The survivors are listed on the run page and
# the full output is kept as an artefact. A survivor in consent, support, the RTT clock, the HL7 ACK or the log
# redactor fails the job.
name: Mutation

on:
  schedule:
    - cron: "23 2 * * 6"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: Mutants (${{ matrix.module }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # Consent has the most mutants and ran past the three-hour limit on 2026-11-14, so it is split in two.
          - module: consent
            shard: "0/2"
            file: "**/communication/consent.rs"
            tests: "pilot7_consent_test qual18_quiet_hours_test cas10_letter_only_test"
            must_be_clean: true
          - module: consent
            shard: "1/2"
            file: "**/communication/consent.rs"
            tests: "pilot7_consent_test qual18_quiet_hours_test cas10_letter_only_test"
            must_be_clean: true
          - module: support
            file: "**/support/mod.rs"
            tests: "cap10_support_test"
            must_be_clean: true
          - module: noshow
            file: "**/noshow/mod.rs"
            tests: "cas5_noshow_test"
            must_be_clean: false
          - module: analytics
            file: "**/analytics/mod.rs"
            tests: "cap11_analytics_test pilot10_refill_test"
            must_be_clean: false
          # Clean on 2026-11-18; kept clean. The RTT clock is in the domain crate, so it rebuilds in seconds.
          - module: rtt-clock
            package: patient-administration-system-domain
            file: "**/models/rtt.rs"
            tests: ""
            must_be_clean: true
          - module: hl7-ack
            file: "**/hl7v2/ack.rs"
            tests: ""
            must_be_clean: true
          - module: hl7-redact
            file: "**/hl7v2/redact.rs"
            tests: ""
            must_be_clean: true
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pas
          POSTGRES_PASSWORD: pas_dev_password
          POSTGRES_DB: pas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pas:pas_dev_password@localhost:5432/pas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-mutants
      - run: cargo run -p patient-administration-system-migrations --bin pas-migrate -- up
      - name: Mutate and test
        env:
          FILE: ${{ matrix.file }}
          PACKAGE: ${{ matrix.package || 'patient-administration-system' }}
          TESTS: ${{ matrix.tests }}
          SHARD: ${{ matrix.shard }}
        run: |
          args=(--cargo-test-arg=--lib)
          if [ -n "$SHARD" ]; then args+=(--shard "$SHARD"); fi
          for t in $TESTS; do args+=("--cargo-test-arg=--test=$t"); done
          # cargo-mutants exits non-zero when a mutant survives; the next step decides what that means.
          # After `--`, arguments go to `cargo test`; after a second `--`, to the test binaries.
          cargo mutants -p "$PACKAGE" --file "$FILE" --output . "${args[@]}" \
            -- -- --include-ignored --test-threads=1 || true
      - name: Report
        env:
          MODULE: ${{ matrix.module }}
          MUST_BE_CLEAN: ${{ matrix.must_be_clean }}
          SHARD: ${{ matrix.shard }}
        run: |
          out=mutants.out
          count() { if [ -f "$out/$1.txt" ]; then wc -l < "$out/$1.txt" | tr -d ' '; else echo 0; fi; }
          caught=$(count caught); missed=$(count missed); timeout=$(count timeout); unviable=$(count unviable)
          if [ ! -f "$out/outcomes.json" ]; then
            echo "cargo-mutants did not finish in $MODULE (no outcomes.json): the baseline build or tests failed" >&2
            exit 1
          fi
          {
            echo "### Mutants in $MODULE ${SHARD}: $caught caught, $missed survived, $timeout timed out, $unviable unviable"
            if [ "$missed" -gt 0 ]; then echo 'Survived (no test noticed the change):'; echo '```'; cat "$out/missed.txt"; echo '```'; fi
            # A timeout is counted as caught (the change made a test hang), but it is listed: a test that hangs
            # rather than fails is worth knowing about.
            if [ "$timeout" -gt 0 ]; then echo 'Timed out:'; echo '```'; cat "$out/timeout.txt"; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MUST_BE_CLEAN" = true ] && [ "$missed" -gt 0 ]; then
            echo "$missed mutant(s) survived in $MODULE" >&2
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-${{ matrix.module }}${{ matrix.shard && format('-{0}', strategy.job-index) || '' }}
          path: mutants.out
