# Pushing a tag vX.Y.Z builds and publishes a release. Nothing is published by a pull request.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  verify:
    name: "Tag, version and changelog agree"
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # Fails unless the tag, the server crate's version and a CHANGELOG entry all agree.
      - run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: release-notes, path: release-notes.md }

  deny:
    name: Dependencies (cargo deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check, arguments: --all-features }

  sbom:
    name: SBOMs (CycloneDX)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - run: cargo install cargo-cyclonedx --locked && cargo cyclonedx --format json
      - uses: pnpm/action-setup@v4
        with: { version: 12.10.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 26 }
      - run: pnpm install --frozen-lockfile && pnpm dlx @cyclonedx/cyclonedx-npm --output-file ../sbom-ui.cdx.json
        working-directory: patient-administration-system-ui-with-svelte
      - uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: |
            **/*.cdx.json
            sbom-ui.cdx.json

  images:
    name: Container images
    needs: [verify, deny]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: server
        uses: docker/build-push-action@v6
        with:
          context: patient-administration-system-with-rust
          file: patient-administration-system-with-rust/Containerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository }}/server:${{ github.ref_name }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/server
          subject-digest: ${{ steps.server.outputs.digest }}
          push-to-registry: true
      - name: The server image carries the verified version
        run: |
          image="ghcr.io/${{ github.repository }}/server:${{ github.ref_name }}"
          docker pull "$image" >/dev/null
          got="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image")"
          [ "$got" = "${{ needs.verify.outputs.version }}" ] || { echo "image label $got != ${{ needs.verify.outputs.version }}" >&2; exit 1; }
      - id: ui
        uses: docker/build-push-action@v6
        with:
          context: patient-administration-system-ui-with-svelte
          file: patient-administration-system-ui-with-svelte/Containerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository }}/ui:${{ github.ref_name }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/ui
          subject-digest: ${{ steps.ui.outputs.digest }}
          push-to-registry: true
      - name: The UI image carries the verified version
        run: |
          image="ghcr.io/${{ github.repository }}/ui:${{ github.ref_name }}"
          docker pull "$image" >/dev/null
          got="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image")"
          [ "$got" = "${{ needs.verify.outputs.version }}" ] || { echo "image label $got != ${{ needs.verify.outputs.version }}" >&2; exit 1; }

  release:
    name: GitHub release
    needs: [verify, deny, sbom, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: release-notes }
      - uses: actions/download-artifact@v4
        with: { name: sboms }
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: "**/*.cdx.json"
