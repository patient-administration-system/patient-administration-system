# Weekly fuzzing of the code that reads outside input (QUAL-17): HL7 v2 messages and batches, text replies,
# NHS numbers. Each target runs for five minutes looking for a panic; a crash uploads its input. The
# targets live in patient-administration-system-with-rust/fuzz (nightly and a sanitizer, so not in CI).
name: Fuzz

on:
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [hl7_message, hl7_batch, text_reply, nhs_number]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-fuzz
      - name: Fuzz for five minutes
        working-directory: patient-administration-system-with-rust/fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +nightly fuzz run "$TARGET" -O -- -max_total_time=300
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: patient-administration-system-with-rust/fuzz/artifacts
