# One workflow, many jobs, and ONE required check: `ci-ok`. Require only `ci-ok` in branch
# protection; it fails if any job failed, was cancelled, or was skipped.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must equal `channel` in rust-toolchain.toml; the `fresh-clone` job asserts it.
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests without a database)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just
      - run: just rust

  rust-db:
    name: Rust (tests that need PostgreSQL, with coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pas
          POSTGRES_PASSWORD: pas_dev_password
          POSTGRES_DB: pas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pas:pas_dev_password@localhost:5432/pas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component llvm-tools && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-llvm-cov,just
      # `--ignored` runs ONLY the tests marked #[ignore]; they fail (not skip) without a database. Run under
      # coverage, with the unit tests after them, so CI publishes one line-coverage report (QUAL-17).
      - run: just rust-db-coverage
      - name: Coverage report
        run: |
          {
            echo '### Rust line coverage (unit and database tests)'
            echo '```'
            just coverage-summary
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: lcov.info

  fhir-validation:
    name: FHIR R4 responses (HL7 validator, IHE BALP and Scheduling)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pas
          POSTGRES_PASSWORD: pas_dev_password
          POSTGRES_DB: pas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pas:pas_dev_password@localhost:5432/pas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just
      # Real responses of the R4 routes, checked by the official validator (pinned release and SHA-256 in the
      # script) against the BALP and IHE Scheduling profiles. It fetches the FHIR packages from packages.fhir.org.
      - run: just fhir

  deny:
    name: Dependencies (cargo deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      # Prebuilt binaries, not a compile from source on every run.
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny,cargo-machete,just
      # Advisories, licences and sources; then unused dependencies, which still cost build time and attack surface.
      - run: just deny

  ui:
    name: UI (check, unit tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: patient-administration-system-ui-with-svelte
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.10.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: patient-administration-system-ui-with-svelte/pnpm-lock.yaml
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just
      # Audit (a high or critical advisory fails the build), API types regenerated from spec/openapi.json must
      # change nothing, type check, Prettier and lint, unit tests with the coverage thresholds in vite.config.ts,
      # build, bundle budget.
      - run: just ui

  ui-e2e:
    name: "UI (browser tests: Keycloak, axe, CSP, phone width)"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: patient-administration-system-ui-with-svelte
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.10.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: patient-administration-system-ui-with-svelte/pnpm-lock.yaml
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just
      - run: pnpm install --frozen-lockfile
      # The browser suite runs the real token issuer (a Rust binary) next to the UI.
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
      # The token issuer for both suites; the API and its migrations for the real-API suite (QUAL-20).
      - run: just e2e-build
      - run: just e2e-up
        env:
          CONTAINER_CMD: docker
      - run: just e2e-wait
        env:
          CONTAINER_CMD: docker
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: just e2e-suite
        env:
          KEYCLOAK_URL: http://localhost:8180
          CI: "true"
      # FR-10 against the real PAS API on the compose database, not the mock (QUAL-20).
      - run: just e2e-real-api
        env:
          KEYCLOAK_URL: http://localhost:8180
          REAL_API_DATABASE_URL: postgres://pas:pas_dev_password@localhost:5432/pas
          PAS_SERVER_BIN: target/debug/patient-administration-system
          PAS_MIGRATE_BIN: target/debug/pas-migrate
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            patient-administration-system-ui-with-svelte/test-results
            patient-administration-system-ui-with-svelte/playwright-report

  docs:
    name: Docs (links, generated status)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits, so a pull request's merge commit has its base (SAFE-6).
          fetch-depth: 2
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just
      - run: just docs-scripts script-tests
      # SAFE-6: list the hazards whose code or tests the pull request touches, for the
      # CSO. Report only: it never fails the job.
      - name: Hazards this change touches
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          { echo '```'; xargs python3 scripts/check-hazard-tests.py --changed < "$RUNNER_TEMP/changed.txt"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --config lychee.toml .
          fail: true

  workflows:
    name: Workflows (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just
      # actionlint, then zizmor's offline audits (no token needed; any finding of low severity or above fails).
      - run: just workflows
        env:
          CONTAINER_CMD: docker

  restore:
    name: Backup and restore drill
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PG_CONTAINER: pg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just
      - run: just restore-up
      - run: just migrate
        env:
          DATABASE_URL: postgres://pas:pas_dev_password@localhost:5432/pas
      # Seeds rows, so the drill compares data and not an empty schema; runs the drill; then runs it again with one
      # altered row, which it must notice.
      - run: just restore

  container:
    name: Container image builds (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The two images build side by side, with the settings they ship with. The server image compiled every
    # dependency from scratch (about ten minutes), the slowest job of the run; turning off its LTO made no
    # difference (QUAL-24). Its Containerfile keeps the cargo registry and target/ in cache mounts, which
    # rootless podman holds in buildah's cache directory on the runner, so that directory is kept between runs
    # (QUAL-46): a rebuild then compiles only this workspace's crates.
    strategy:
      fail-fast: false
      matrix:
        image: [server, ui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just
      - if: matrix.image == 'server'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/tmp/buildah-cache-*
          key: server-image-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'patient-administration-system-with-rust/Containerfile') }}
          restore-keys: server-image-
      - run: just container "$IMAGE"
        env:
          IMAGE: ${{ matrix.image }}
      # Where the cache mounts are and how big, so a cache that keeps nothing shows here.
      - if: matrix.image == 'server'
        run: du -sh /var/tmp/buildah-cache-* || echo "no buildah cache directory under /var/tmp"

  fresh-clone:
    name: Fresh clone builds with locked dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.10.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just
      # The pinned toolchain is the one CI uses, one lockfile at the workspace root (the API image is built from it,
      # QUAL-3), then a locked workspace and UI build.
      - run: just fresh-clone

  ci-ok:
    name: ci-ok
    if: always()
    needs: [rust, rust-db, fhir-validation, deny, ui, ui-e2e, docs, workflows, restore, container, fresh-clone]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job must have succeeded (not failed, cancelled or skipped)
        env:
          NEEDS: ${{ toJSON(needs) }}
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
          SKIPPED: ${{ contains(needs.*.result, 'skipped') }}
        run: |
          echo "$NEEDS"
          test "$FAILED" = "false"
          test "$CANCELLED" = "false"
          test "$SKIPPED" = "false"
