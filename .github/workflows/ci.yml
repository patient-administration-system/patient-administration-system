# One workflow, many jobs, and ONE required check: `ci-ok`. Require only `ci-ok` in branch
# protection; it fails if any job failed, was cancelled, or was skipped.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must equal `channel` in rust-toolchain.toml; the `fresh-clone` job asserts it.
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests without a database)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  rust-db:
    name: Rust (tests that need PostgreSQL, with coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pas
          POSTGRES_PASSWORD: pas_dev_password
          POSTGRES_DB: pas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pas:pas_dev_password@localhost:5432/pas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component llvm-tools && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov
      - run: cargo run -p patient-administration-system-migrations --bin pas-migrate -- up
      # `--ignored` runs ONLY the tests marked #[ignore]; they fail (not skip) without a database. Run under
      # coverage, with the unit tests after them, so CI publishes one line-coverage report (QUAL-17).
      - run: cargo llvm-cov --workspace --no-report -- --ignored --test-threads=1
      - run: cargo llvm-cov --workspace --no-report
      - name: Coverage report
        run: |
          {
            echo '### Rust line coverage (unit and database tests)'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --lcov --output-path lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: lcov.info

  fhir-validation:
    name: FHIR R4 responses (HL7 validator, IHE BALP and Scheduling)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pas
          POSTGRES_PASSWORD: pas_dev_password
          POSTGRES_DB: pas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pas:pas_dev_password@localhost:5432/pas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo run -p patient-administration-system-migrations --bin pas-migrate -- up
      # Real responses of the R4 routes, checked by the official validator (pinned release and SHA-256 in the
      # script) against the BALP and IHE Scheduling profiles. It fetches the FHIR packages from packages.fhir.org.
      - run: java -version && scripts/validate-fhir.sh

  deny:
    name: Dependencies (cargo deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
      # An unused dependency still costs build time and attack surface.
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      # A prebuilt binary, not a compile from source on every run.
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-machete
      - run: cargo machete

  ui:
    name: UI (check, unit tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: patient-administration-system-ui-with-svelte
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.10.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: patient-administration-system-ui-with-svelte/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # A known high or critical advisory in a production dependency fails the build.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm run check
      # Formatting (Prettier) and lint rules: an unformatted file fails.
      - run: pnpm run lint
      # Unit tests, failing if the server code's coverage drops below the thresholds in vite.config.ts.
      - run: pnpm run test:coverage
      - run: pnpm run build
      - run: pnpm run bundle:check

  ui-e2e:
    name: "UI (browser tests: Keycloak, axe, CSP, phone width)"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: patient-administration-system-ui-with-svelte
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.10.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: patient-administration-system-ui-with-svelte/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The browser suite runs the real token issuer (a Rust binary) next to the UI.
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
      # The token issuer for both suites; the API and its migrations for the real-API suite (QUAL-20).
      - run: cargo build --locked --bin pas-token-issuer --bin patient-administration-system --bin pas-migrate
        working-directory: .
      - name: Start PostgreSQL and Keycloak
        working-directory: .
        run: docker compose -f podman/compose.yml up -d
      - name: Wait for the realm
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8180/realms/pas/.well-known/openid-configuration -o /dev/null && exit 0
            sleep 3
          done
          docker compose -f ../podman/compose.yml logs keycloak
          echo "Keycloak did not become ready" >&2
          exit 1
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=chromium --project=mobile
        env:
          KEYCLOAK_URL: http://localhost:8180
          CI: "true"
      # FR-10 against the real PAS API on the compose database, not the mock (QUAL-20).
      - run: pnpm exec playwright test -c playwright.real-api.config.ts
        env:
          KEYCLOAK_URL: http://localhost:8180
          REAL_API_DATABASE_URL: postgres://pas:pas_dev_password@localhost:5432/pas
          PAS_SERVER_BIN: target/debug/patient-administration-system
          PAS_MIGRATE_BIN: target/debug/pas-migrate
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            patient-administration-system-ui-with-svelte/test-results
            patient-administration-system-ui-with-svelte/playwright-report

  docs:
    name: Docs (links, generated status)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check-links.py
      - run: scripts/generate-status.sh --check
      - run: python3 scripts/generate-llms.py --check
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --config lychee.toml .
          fail: true

  workflows:
    name: Workflows (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo" --workdir /repo docker.io/rhysd/actionlint:1.7.12 -color
      # Offline audits only, so no token is needed; any finding of low severity or above fails.
      - run: pipx run zizmor==1.31.1 --offline --min-severity low .github/workflows

  restore:
    name: Backup and restore drill
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PG_CONTAINER: pg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Start PostgreSQL
        run: |
          podman run -d --name pg -e POSTGRES_USER=pas -e POSTGRES_PASSWORD=pas_dev_password -e POSTGRES_DB=pas -p 5432:5432 docker.io/library/postgres:18
          for _ in $(seq 1 30); do podman exec pg pg_isready -U pas && break; sleep 2; done
      - run: cargo run -p patient-administration-system-migrations --bin pas-migrate -- up
        env:
          DATABASE_URL: postgres://pas:pas_dev_password@localhost:5432/pas
      - name: Seed rows, so the drill compares data and not an empty schema
        run: podman exec -i pg psql -U pas -d pas -v ON_ERROR_STOP=1 -q < scripts/restore-seed.sql
      - run: scripts/restore-test.sh
      - name: The drill notices one altered row
        run: |
          if RESTORE_DRILL_TAMPER=1 scripts/restore-test.sh; then
            echo "the drill passed although a restored row was altered" >&2; exit 1
          fi

  container:
    name: Container image builds (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The two images build side by side, with the settings they ship with. The server image compiles every
    # dependency from scratch (about ten minutes) and is the slowest job of the run; turning off its LTO here
    # made no difference, so a build cache that survives between runs is the next step (QUAL-24).
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            file: patient-administration-system-with-rust/Containerfile
            context: .
            args: ""
          - image: ui
            file: patient-administration-system-ui-with-svelte/Containerfile
            context: patient-administration-system-ui-with-svelte
            args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          FILE: ${{ matrix.file }}
          CONTEXT: ${{ matrix.context }}
          ARGS: ${{ matrix.args }}
          IMAGE: ${{ matrix.image }}
        run: |
          read -ra args <<< "$ARGS"
          podman build --format docker -f "$FILE" "${args[@]}" -t "pas-$IMAGE" "$CONTEXT"

  fresh-clone:
    name: Fresh clone builds with locked dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The pinned toolchain is the one CI uses
        run: |
          pinned="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          test "$pinned" = "$RUST_TOOLCHAIN" || { echo "rust-toolchain.toml ($pinned) != CI ($RUST_TOOLCHAIN)" >&2; exit 1; }
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - name: One lockfile, at the workspace root (the API image is built from it, QUAL-3)
        run: |
          extra="$(git ls-files '*/Cargo.lock')"
          test -z "$extra" || { echo "crate-level lockfiles: $extra" >&2; exit 1; }
          grep -q -- '--locked' patient-administration-system-with-rust/Containerfile
      - run: cargo build --workspace --locked
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.10.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: patient-administration-system-ui-with-svelte

  ci-ok:
    name: ci-ok
    if: always()
    needs: [rust, rust-db, fhir-validation, deny, ui, ui-e2e, docs, workflows, restore, container, fresh-clone]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job must have succeeded (not failed, cancelled or skipped)
        env:
          NEEDS: ${{ toJSON(needs) }}
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
          SKIPPED: ${{ contains(needs.*.result, 'skipped') }}
        run: |
          echo "$NEEDS"
          test "$FAILED" = "false"
          test "$CANCELLED" = "false"
          test "$SKIPPED" = "false"
