# cargo-deny policy for the whole workspace: `cargo deny check`.
# Every advisory ignore carries the reason and what would let us remove it.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Nothing is accepted. Add an advisory here only with a reason, and remove it when it no longer applies.
ignore = [
    # chrono, chrono-tz and chrono-tz-build are unmaintained (advisories of 2026-11; none is a vulnerability).
    # The migration to jiff is queued (tasks.md); remove these then. tera 1 keeps chrono until it is replaced.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; jiff migration queued" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained; jiff migration queued" },
    { id = "RUSTSEC-2026-0559", reason = "chrono-tz-build unmaintained; jiff migration queued" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
