# cargo-deny policy for the whole workspace: `cargo deny check`.
# Every advisory ignore carries the reason and what would let us remove it.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# DEP-2 (loco-rs 1.2, sea-orm 2) cleared the quick-xml, zip, webpki-roots, fxhash and proc-macro-error2 ignores,
# and dropping loco-rs's `auth` feature removed `rsa`. One is left.
ignore = [
    # Unmaintained (not vulnerable). Pulled in by loco-rs -> loco-gen -> rrgen -> serde_yaml, which reads our own config files.
    # Remove when rrgen moves off serde_yaml.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained; via loco-rs -> loco-gen -> rrgen -> serde_yaml (reads our own config files)" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
