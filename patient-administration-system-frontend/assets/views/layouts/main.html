{# Base layout. Lily Design System headless markup + page-level styling. #}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}PAS{% endblock %}</title>
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false}'>
<script src="/static/js/htmx-2.0.3.min.js" integrity="sha384-0895/pl2MU10Hqc6jd4RvrthNlDiE9U1tWmX7WRESftEDRosgxNsQG/Ze9YMRzHq" defer></script>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<header class="header" aria-label="Site header">
  <h1>PAS</h1>
  <nav aria-label="Primary navigation">
    <a href="/dashboard">Dashboard</a>
    <a href="/patients">Patients</a>
    <a href="/rtt">RTT</a>
    <a href="/admissions/new">Admit</a>
    <a href="/appointments/new">Book</a>
    <a href="/letters/new">Compose</a>
  </nav>
  <span class="meta s-push-right">v{{ version }}</span>
</header>

{% block content %}{% endblock %}

<footer class="footer" aria-label="Site footer">
  Lily Design System markup · Axum + Tera + HTMX · {{ rendered_at | default(value="") }}
</footer>

</body>
</html>
