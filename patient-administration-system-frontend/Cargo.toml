[package]
name = "patient-administration-system-frontend"
version = "0.2.0"
edition = "2024"
# MSRV: two releases behind the pinned toolchain (rust-toolchain.toml); `cargo +1.97 check` proves it.
rust-version = "1.97"
authors = ["joel@joelparkerhenderson.com"]
description = "Axum and axa front-end for the Patient Administration System (PAS). Tera templates + HTMX live-refresh + Lily Design System markup. Patient reads delegate to person-service (v0.2.0); PAS-owned reads share the PAS PostgreSQL database via sqlx; writes go through the PAS Axum API server."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# Shared service plumbing: routes, middleware, configuration, logging, shutdown, the command line.
axa = { version = "0.10", features = ["sqlx", "tracing"] }
axum = { version = "0.8", default-features = false }

# HTML templates (`views`), and the files under `/static`.
tera = { version = "2.1", features = ["glob_fs"] }
tower-http = { version = "0.6", features = ["fs"] }

# Cookie-based CSRF token storage for the write-flow forms (`csrf` module).
axum-extra = { version = "0.12", features = ["cookie"] }

# Async runtime.
tokio = { version = "1.54", features = ["full"] }

# Database reads. Queries are checked at run time, so a build needs no database.
sqlx = { version = "0.9", default-features = false, features = ["postgres", "derive", "chrono", "uuid", "json"] }

# Reuse the PAS migrations crate so `patient-administration-system-frontend` and the PAS Axum
# binary apply identical schemas via `pas-migrate up`.
migration = { path = "../patient-administration-system-with-rust/migrations", version = "0.3.0", package = "patient-administration-system-migrations" }

# Serialization.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Outbound HTTP — the front-end can also call the PAS REST API when it
# wants behavior that lives in the PAS service layer rather than read
# straight from the DB.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "form"] }

# Utilities.
uuid = { version = "1.29", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
# A warning when a dashboard panel cannot read the database.
tracing = "0.1"

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
axa = { version = "0.10", features = ["sqlx", "tracing"] }
# The request-level test helpers, their own crate since axa 0.10.
axa-test = "0.1"
serial_test = "4.0"

[[bin]]
name = "patient-administration-system-frontend"
path = "src/main.rs"

# [profile.release] hoisted to the workspace root.

[lints]
workspace = true
